[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = none

; ---------------------------------------------------------------------------
; 本工程不使用 ST 官方框架(SPL/HAL/Cube)：
;   Inc/stm32f10x.h 已经自带全部用到的寄存器定义，
;   加上 Startup/ 里的启动文件就足以编译，体积也最小。
;
; 如果你更习惯标准库或 HAL，把 framework 改成 stm32cube，
; 然后用 CubeMX 生成时钟/GPIO 初始化，再把 chassis/pid/protocol 搬过去即可
; —— 这几个模块是纯算法，不依赖任何外设库，可以原样复用。
; ---------------------------------------------------------------------------

build_flags =
    -std=c99
    -Wall
    -Wextra
    -Og
    -g3
    -ffunction-sections
    -fdata-sections
    -mcpu=cortex-m3
    -mthumb
    -DUSE_HAL_DRIVER=0
    -I Inc

build_unflags =
    -Os

board_build.ldscript = STM32F103C8Tx_FLASH.ld
board_build.mcu = stm32f103c8t6

; 输出 hex，方便用 ST-Link Utility 直接烧
board_build.hex = yes

; 也可以用串口烧录（需 BOOT0 拉高）：
; upload_protocol = serial
; upload_port = COM3

; 默认用 ST-Link
upload_protocol = stlink
debug_tool = stlink
